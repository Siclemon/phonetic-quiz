<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonetic Quiz</title>
    <link rel="stylesheet" href="./src/style.css">
    <script src="./src/main.ts" defer type="module"></script>
</head>

<body class="paper">
    <aside>
        <button id="open_settings"><svg height="200px" width="200px" version="1.1" id="_x32_"
                xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512"
                xml:space="preserve" fill="#000000">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <g>
                        <path class="st0"
                            d="M511.414,217.728c-1.902-9.034-8.242-16.503-16.852-19.856l-30.197-11.736v31.046l5.718,2.223 c2.58,1.008,4.483,3.25,5.048,5.953c0.565,2.712-0.263,5.538-2.223,7.497L279.14,426.609c-3.834,3.824-9.561,5.03-14.62,3.071 l-43.064-16.748v31.046l30.226,11.755c17.18,6.678,36.678,2.581,49.715-10.454l202.594-202.59 C510.519,236.161,513.317,226.77,511.414,217.728z">
                        </path>
                        <path class="st0"
                            d="M30.914,299.684c1.356-18.895,7.423-43.649,28.466-42.481l192.2,74.751 c17.228,6.698,36.782,2.553,49.818-10.558l185.771-186.991c6.5-6.538,9.269-15.919,7.357-24.933 c-1.912-9.023-8.242-16.474-16.832-19.809L286.666,15.374c-17.228-6.698-36.791-2.553-49.818,10.559L21.646,242.538 C4.625,256.545,0,282.664,0,305.863c0,23.2,1.545,51.043,27.844,61.866l-6.198-1.451l57.942,22.532v-20.742 c0-3.372,0.42-6.668,1.107-9.88l-38.94-15.147C29.37,338.35,29.36,321.499,30.914,299.684z">
                        </path>
                        <path class="st0"
                            d="M111.048,352.658c-4.088,4.107-6.381,9.645-6.381,15.41v96.076l40.823-8.741l50.888,44.383v-96.048 c0-5.793,2.298-11.331,6.386-15.419l16.272-16.276l-91.706-35.662L111.048,352.658z">
                        </path>
                    </g>
                </g>
            </svg></button>
    </aside>
    <main>
        <form action="" id="game">
            <label for="input" class="form__label"></label>
            <input type="text" name="" id="input" class="form__input">
            <button class="form__button">🪶</button>
        </form>
        <section class="answers">
            <header class="answers__header"></header>
        </section>
    </main>
    <dialog id="settings">
        <header>
            <h2>Options</h2>
            <button id="settings__close_button">X</button>
        </header>
        <label for="settings__diff">
            <span>Difficulty:</span>
            <output for="settings__diff" id="settings__diff__output"></output>
            <input type="range" id="settings__diff" min="1" max="8" step="1" value="2" class="slider">
        </label>
        <label for="settings__spread">
            <span>Variety:</span>
            <output for="settings__spread" id="settings__spread__output"></output>
            <input type="range" id="settings__spread" min="1" max="8" step="1" value="3" class="slider">
        </label>
        <figure>
            <figcaption>Difficulty distribution</figcaption>
            <output id="settings__freq__chart">
                <div><span>1</span></div>
                <div><span>2</span></div>
                <div><span>3</span></div>
                <div><span>4</span></div>
                <div><span>5</span></div>
                <div><span>6</span></div>
                <div><span>7</span></div>
                <div><span>8</span></div>
            </output>
        </figure>
    </dialog>
</body>

</html>
